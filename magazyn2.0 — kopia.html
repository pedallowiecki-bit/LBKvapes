<!DOCTYPE html>
<html lang="pl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LBKVAPE - Magazyn i Zapis na GitHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } }
    }
  </script>
</head>
<body class="bg-neutral-950 text-neutral-100 font-sans min-h-screen p-6" onload="initInventory()">
  <div class="max-w-4xl mx-auto w-full space-y-6">
    
    <!-- NAGŁÓWEK ORAZ KONFIGURACJA GITHUB -->
    <div class="bg-neutral-900 p-5 rounded-3xl border border-neutral-800 shadow-xl space-y-4">
      <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
        <div>
          <span class="text-[10px] font-black uppercase tracking-widest text-orange-500 block">Magazyn & GitHub Sync</span>
          <h1 class="text-lg font-black uppercase text-white">Stany Magazynowe (Sztuki i Smaki)</h1>
        </div>
        <div class="flex gap-2 w-full sm:w-auto">
          <button onclick="saveInventoryToGitHub()" id="save-btn" class="flex-1 sm:flex-none bg-orange-500 hover:bg-orange-600 text-white text-xs font-bold px-5 py-2.5 rounded-2xl transition-all cursor-pointer shadow-lg shadow-orange-500/20">💾 Zapisz w GitHubie</button>
          <a href="index.html" class="bg-neutral-800 hover:bg-neutral-700 text-white text-xs font-bold px-4 py-2.5 rounded-2xl transition-all text-center">← Sklep</a>
        </div>
      </div>

      <!-- PANEL KONFIGURACJI GITHUB -->
      <div class="bg-neutral-950 p-4 rounded-2xl border border-neutral-800/80 space-y-3">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-orange-400 uppercase">🔑 Konfiguracja GitHub (Wymagana do zapisu i odczytu)</span>
          <button onclick="toggleConfig()" class="text-[11px] text-neutral-400 hover:text-white underline cursor-pointer">Zwiń/Rozwiń</button>
        </div>
        <div id="github-config-box" class="grid grid-cols-1 sm:grid-cols-3 gap-2.5 pt-1">
          <input type="text" id="gh-owner" placeholder="Owner (np. pedallowiecki-bit)" class="bg-neutral-900 text-white border border-neutral-800 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-orange-500" onchange="initInventory()">
          <input type="text" id="gh-repo" placeholder="Repo (np. LBKvapes)" class="bg-neutral-900 text-white border border-neutral-800 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-orange-500" onchange="initInventory()">
          <input type="password" id="gh-token" placeholder="GitHub Token (ghp_...)" class="bg-neutral-900 text-white border border-neutral-800 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-orange-500" onchange="initInventory()">
        </div>
      </div>
    </div>

    <!-- LISTA PRODUKTÓW -->
    <div class="bg-neutral-900 rounded-3xl p-6 border border-neutral-800 shadow-xl space-y-4">
      <div class="flex justify-between items-center">
        <p class="text-xs text-neutral-400">Edytuj stany sztuk. Kliknięcie "Zapisz w GitHubie" zaktualizuje plik products.json w Twoim repozytorium.</p>
        <span id="status-msg" class="text-xs font-bold hidden"></span>
      </div>

      <div id="inventory-list" class="space-y-4">
        <p class="text-center text-neutral-500 py-8">Ładowanie produktów z repozytorium...</p>
      </div>
    </div>
  </div>

  <script>
    let products = [];
    let fileSha = '';

    async function initInventory() {
      const owner = document.getElementById('gh-owner').value.trim() || localStorage.getItem('lbk_gh_owner') || 'pedallowiecki-bit';
      const repo = document.getElementById('gh-repo').value.trim() || localStorage.getItem('lbk_gh_repo') || 'LBKvapes';
      const token = document.getElementById('gh-token').value.trim() || localStorage.getItem('lbk_gh_token') || '';

      document.getElementById('gh-owner').value = owner;
      document.getElementById('gh-repo').value = repo;
      document.getElementById('gh-token').value = token;

      let loaded = false;

      // 1. Spróbuj pobrać bezpośrednio przez oficjalne GitHub API
      if (token && owner && repo) {
        try {
          const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/products.json?t=` + new Date().getTime();
          const res = await fetch(apiUrl, {
            headers: { 'Authorization': `token ${token}` }
          });
          if (res.ok) {
            const fileData = await res.json();
            fileSha = fileData.sha;
            const decodedContent = decodeURIComponent(escape(atob(fileData.content.replace(/\n/g, ''))));
            products = JSON.parse(decodedContent);
            loaded = true;
          }
        } catch (e) {
          console.warn("Błąd pobierania przez GitHub API:", e);
        }
      }

      // 2. Jeśli API zawiodło, spróbuj pobrać plik lokalnie / z GitHub Pages
      if (!loaded) {
        try {
          const res = await fetch('products.json?t=' + new Date().getTime());
          if (res.ok) {
            products = await res.json();
            loaded = true;
          }
        } catch (e) {
          console.warn("Błąd lokalnego pobierania products.json:", e);
        }
      }

      // 3. Wczytaj stany zapisane w localStorage
      const savedQtys = localStorage.getItem('lbk_inventory_qtys');
      let inventoryData = {};
      if (savedQtys) {
        try { inventoryData = JSON.parse(savedQtys); } catch(e){}
      }

      // Przypisz stany do produktów
      if (products && products.length > 0) {
        products.forEach(p => {
          if (!p.stock) p.stock = {};
          if (p.smaki && p.smaki.length > 0) {
            p.smaki.forEach(f => {
              const key = `${p.id}_${f}`;
              if (inventoryData[key] !== undefined) {
                p.stock[f] = inventoryData[key];
              }
            });
          }
        });
      }

      renderInventoryList();
    }

    function toggleConfig() {
      document.getElementById('github-config-box').classList.toggle('hidden');
    }

    function renderInventoryList() {
      const container = document.getElementById('inventory-list');
      let html = '';

      if (!products || products.length === 0) {
        container.innerHTML = '<p class="text-center text-red-400 py-8">Brak produktów do wyświetlenia lub niepoprawne dane GitHub.</p>';
        return;
      }

      products.forEach((p, pIndex) => {
        html += `
          <div class="bg-neutral-950 p-5 rounded-2xl border border-neutral-800 space-y-3">
            <div class="flex items-center justify-between border-b border-neutral-800/80 pb-3">
              <div class="flex items-center gap-3">
                <img src="${p.img || ''}" class="w-10 h-10 object-contain bg-neutral-900 rounded-xl p-1 border border-neutral-800">
                <div>
                  <span class="text-[10px] font-mono text-orange-500">${p.id}</span>
                  <h3 class="text-xs font-black uppercase text-white">${p.name}</h3>
                </div>
              </div>
              <span class="text-xs font-bold text-neutral-400 uppercase">${p.type || p.category || 'produkt'}</span>
            </div>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2.5 pt-1">
        `;

        if (p.smaki && p.smaki.length > 0) {
          p.smaki.forEach((flavor) => {
            if (!p.stock) p.stock = {};
            const qty = p.stock[flavor] !== undefined ? p.stock[flavor] : 0;
            
            html += `
              <div class="bg-neutral-900 p-3 rounded-xl border border-neutral-800 flex items-center justify-between gap-2">
                <span class="text-xs text-neutral-300 font-medium truncate" title="${flavor}">${flavor}</span>
                <input type="number" min="0" value="${qty}" onchange="updateProductStock(${pIndex}, '${flavor}', this.value)" class="w-16 bg-neutral-950 text-orange-400 font-black text-center text-xs border border-neutral-700 rounded-lg py-1.5 focus:outline-none focus:border-orange-500">
              </div>
            `;
          });
        }

        html += `</div></div>`;
      });

      container.innerHTML = html;
    }

    function updateProductStock(pIndex, flavor, val) {
      if (!products[pIndex].stock) {
        products[pIndex].stock = {};
      }
      const qtyNum = parseInt(val) || 0;
      products[pIndex].stock[flavor] = qtyNum;

      // Synchronizuj również z kluczem w localStorage
      const savedQtys = localStorage.getItem('lbk_inventory_qtys');
      let inventoryData = savedQtys ? JSON.parse(savedQtys) : {};
      const key = `${products[pIndex].id}_${flavor}`;
      inventoryData[key] = qtyNum;
      localStorage.setItem('lbk_inventory_qtys', JSON.stringify(inventoryData));
    }

    async function saveInventoryToGitHub() {
      const owner = document.getElementById('gh-owner').value.trim();
      const repo = document.getElementById('gh-repo').value.trim();
      const token = document.getElementById('gh-token').value.trim();
      const msg = document.getElementById('status-msg');
      const saveBtn = document.getElementById('save-btn');

      if (!owner || !repo || !token) {
        alert('Wypełnij dane konfiguracji GitHub (Owner, Repo oraz Token)!');
        return;
      }

      localStorage.setItem('lbk_gh_owner', owner);
      localStorage.setItem('lbk_gh_repo', repo);
      localStorage.setItem('lbk_gh_token', token);

      saveBtn.disabled = true;
      saveBtn.innerText = 'Wysyłanie do GitHub...';
      msg.className = 'text-xs font-bold text-orange-400';
      msg.innerText = 'Trwa aktualizacja pliku...';
      msg.classList.remove('hidden');

      const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/products.json`;

      try {
        const getRes = await fetch(apiUrl, {
          headers: { 'Authorization': `token ${token}` }
        });
        
        if (getRes.ok) {
          const fileData = await getRes.json();
          fileSha = fileData.sha;
        }

        const updatedJsonString = JSON.stringify(products, null, 2);
        const base64Content = btoa(unescape(encodeURIComponent(updatedJsonString)));

        const putRes = await fetch(apiUrl, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${token}`,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            message: 'Aktualizacja stanów magazynowych przez panel',
            content: base64Content,
            sha: fileSha
          })
        });

        if (putRes.ok) {
          msg.className = 'text-xs font-bold text-green-400';
          msg.innerText = '✅ Zapisano pomyślnie w pliku products.json na GitHubie!';
        } else {
          const errJson = await putRes.json();
          throw new Error(errJson.message || 'Błąd API GitHub');
        }
      } catch (e) {
        console.error(e);
        msg.className = 'text-xs font-bold text-red-400';
        msg.innerText = '❌ Błąd zapisu: ' + e.message;
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerText = '💾 Zapisz w GitHubie';
      }
    }
  </script>
</body>
</html>
